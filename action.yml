name: 'Directory Listing Generator'
description: 'A composite action that sets up Python and runs src/main.py to generate directory listings.'
branding:
  icon: 'list'
  color: 'blue'

inputs:
  folder:
    description: 'The target directory to process'
    required: false
    default: '.'
  site_url:
    description: 'The base URL for the site (defaults to <repository_owner>.github.io)'
    required: false
    default: ''
  base_url:
    description: 'The base path for the directory (defaults to repository name)'
    required: false
    default: ''
  exclude:
    description: 'Comma-separated list of files and directories to ignore'
    required: false
    default: '.git'
  site_name:
    description: 'The name of the site'
    required: false
    default: ''
  footer_text:
    description: 'Text to display in the footer'
    required: false
    default: 'Copyright &copy; {year} Pranab Das. All rights reserved.'
# --- DEPLOYMENT INPUTS ---
  github_token:
    description: 'GITHUB_TOKEN for same-repo deployment'
    required: false
    default: ${{ github.token }}
  personal_token:
    description: 'Personal access token for external repository deployment'
    required: false
    default: ''
  publish_dir:
    description: 'Directory to publish'
    required: false
    default: './_site'
  external_repository:
    description: 'External repository to deploy to (e.g., username/repo)'
    required: false
    default: ''
  publish_branch:
    description: 'Branch to deploy to'
    required: false
    default: 'gh-pages'
  commit_message:
    description: 'Commit message for the deployment'
    required: false
    default: 'deploy ref. ${{ github.sha }}'

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.14'
    - name: Run main.py
      env:
        REPO_OWNER: ${{ github.repository_owner }}
        INPUT_SITE_URL: ${{ inputs.site_url }}
        INPUT_BASE_URL: ${{ inputs.base_url }}
        INPUT_EXCLUDE: ${{ inputs.exclude }}
        SITE_NAME: ${{ inputs.site_name }}
        FOOTER_TEXT: ${{ inputs.footer_text }}
      run: |
        REPO_NAME="${GITHUB_REPOSITORY#*/}"
        export SITE_URL="${INPUT_SITE_URL:-${REPO_OWNER}.github.io}"
        export BASE_URL="${INPUT_BASE_URL:-${REPO_NAME}}"
        python ${{ github.action_path }}/src/main.py ${{ inputs.folder }}/.
      shell: bash
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
      with:
        github_token: ${{ inputs.github_token }}
        personal_token: ${{ inputs.personal_token }}
        publish_dir: ${{ inputs.publish_dir }}
        external_repository: ${{ inputs.external_repository }}
        publish_branch: ${{ inputs.publish_branch }}
        full_commit_message: ${{ inputs.commit_message }}
        user_name: "github-actions[bot]"
        user_email: "github-actions[bot]@users.noreply.github.com"
